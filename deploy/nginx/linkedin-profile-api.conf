# nginx site config for shreyaskaushik.dpdns.org — the ONLY public listener.
#
# TOPOLOGY (TLS terminates at the OCI load balancer):
#
#   client --HTTPS--> Cloudflare --HTTPS--> OCI Load Balancer --HTTP--> nginx:80
#                                           (holds the certificate)      |
#                                                                        +--> 127.0.0.1:8000  API
#                                                                        +--> 127.0.0.1:8080  Keycloak
#
# nginx therefore holds NO certificate and listens on port 80 only. Host
# iptables opens 80 and NOT 443, which matches: nothing ever speaks TLS to this
# box. The plaintext hop is load balancer -> instance, inside the OCI VCN, not
# across the public internet.
#
# DO NOT add a `return 301 https://...` here. The load balancer speaks HTTP to
# nginx, so a scheme-based redirect sees "http" on a request the client made
# over HTTPS and redirects forever. http:// is redirected to https:// at the
# Cloudflare edge instead ("Always Use HTTPS"), which is also what stops
# plain-HTTP requests from reaching an origin port that is closed.
#
# Application containers bind 127.0.0.1 only (see docker-compose.yml). nginx is
# the sole process on this host listening off-loopback.

# The load balancer sets X-Forwarded-Proto on a terminating HTTPS listener. If
# it is ever absent, https is the correct assumption: every route to this port
# comes through the load balancer, which only accepts TLS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name shreyaskaushik.dpdns.org;

    # This service carries li_at cookies and bearer tokens. HSTS is correct
    # because the client's connection genuinely is HTTPS (Cloudflare and the
    # load balancer both terminate TLS) and this name serves nothing else.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # A pasted li_at cookie and a Keycloak token both travel in bodies and
    # headers; nothing here uploads files, so a small cap is correct and keeps a
    # runaway body from reaching the API at all.
    client_max_body_size 64k;

    # Do not advertise the nginx patch version.
    server_tokens off;

    access_log /var/log/nginx/linkedin-profile-api.access.log;
    error_log  /var/log/nginx/linkedin-profile-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # $proxy_add_x_forwarded_for APPENDS rather than replaces, so the chain
        # Cloudflare -> load balancer -> nginx survives intact. uvicorn runs with
        # --proxy-headers --forwarded-allow-ips "*" (see the Dockerfile CMD), so
        # the API reads the real client IP and builds https:// URLs.

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Generous: a Voyager fetch is six upstream calls and can legitimately
        # take tens of seconds. Shorter than the load-balancer and Cloudflare
        # idle timeouts, so nginx reports the timeout and the client gets a
        # typed error rather than a 504 or a Cloudflare 524.
        proxy_read_timeout    75s;

        proxy_buffering on;
        proxy_redirect  off;
    }

    # Keycloak's token endpoint, so CAP-3's mint curl has a public path.
    # Longest-prefix wins in nginx, so this takes precedence over `location /`
    # regardless of ordering.
    #
    # Passing Host and X-Forwarded-Proto is what makes the minted token's `iss`
    # read https://shreyaskaushik.dpdns.org/realms/... rather than the container
    # name — Keycloak builds it from these headers (KC_PROXY_HEADERS xforwarded,
    # KC_HOSTNAME_STRICT false). KEYCLOAK_ISSUER_URL in .env must match.
    #
    # /admin/ is deliberately NOT proxied and must stay that way: the Keycloak
    # admin console is reachable over an SSH tunnel to 127.0.0.1:8080 and has no
    # reason to face the internet.
    location /realms/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_redirect  off;
    }
}

# --- Notes --------------------------------------------------------------------
#
# Both graded curl commands work over the public name:
#   mint  https://shreyaskaushik.dpdns.org/realms/<realm>/protocol/openid-connect/token
#   call  https://shreyaskaushik.dpdns.org/api/v1/...
#
# After changing this file on the host:  nginx -t && systemctl reload nginx
#
# The load-balancer health check must probe :80 and expect 200. /health is
# unauthenticated and answers 200 with no token, so it is the right target.
