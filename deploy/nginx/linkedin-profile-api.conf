# nginx site config for shreyaskaushik.dpdns.org — the ONLY public listener.
#
# Install on the instance as:
#   /etc/nginx/sites-available/linkedin-profile-api.conf
# symlinked into sites-enabled/, with the stock `default` site unlinked.
# See ../README.md for the exact commands.
#
# Topology (SPEC "Deployment topology"):
#   Cloudflare (proxied, Full (strict))
#     -> OCI Load Balancer
#       -> this nginx, on the instance's private 10.0.1.173
#         -> 127.0.0.1:8000, the api container published by docker-compose.yml
#
# The application containers keep the loopback-only port bindings they were
# given in story 1. nginx is the only thing that listens off-loopback, so this
# file is the whole of the deployment-time wiring.
#
# Verified against nginx 1.24.0 (Ubuntu noble), the version on the instance:
# `listen ... http2` is used rather than the `http2 on;` directive, which does
# not exist before 1.25.1.

# --- :80 — redirect only ------------------------------------------------------
#
# Every plain-HTTP request is answered with a 301 to the HTTPS URL, /health
# included. That is a deliberate reading of the story's edge-case matrix
# ("Plain HTTP -> Redirected to HTTPS, 301") and it has one operational
# consequence worth stating loudly:
#
#   The OCI Load Balancer's backend health check MUST NOT be an HTTP check
#   against :80 expecting 200 — it will see this 301 and mark the backend
#   unhealthy while nginx is working perfectly. Point the health check at
#   :443 /health, or set its accepted status to 301. ../README.md repeats this.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name shreyaskaushik.dpdns.org;

    # default_server above means this block also catches requests that arrive
    # with an unknown or absent Host header (the load balancer probing by IP).
    # $host is used rather than the literal name so such a probe is redirected
    # to itself rather than being bounced onto the public name.
    return 301 https://$host$request_uri;
}

# --- :443 — the service -------------------------------------------------------
server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name shreyaskaushik.dpdns.org;

    # Cloudflare Origin Certificate — free, 15-year, and trusted only by
    # Cloudflare, which is all Full (strict) requires. Chosen precisely so that
    # there is no ACME client and no renewal on a server nobody watches after
    # submission; there is deliberately no certbot on this host.
    #
    # Both files are installed by hand on the instance and neither is in this
    # repository: *.pem / *.key / *.crt are gitignored from the first commit.
    ssl_certificate     /etc/ssl/certs/shreyaskaushik.dpdns.org.pem;
    ssl_certificate_key /etc/ssl/private/shreyaskaushik.dpdns.org.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # This service carries li_at cookies and bearer tokens. HSTS is safe here
    # because the name is used for nothing but this API.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # A pasted li_at cookie and a Keycloak token both travel in request bodies
    # and headers; nothing here uploads files, so a small cap is correct and
    # keeps a runaway body from reaching the API at all.
    client_max_body_size 64k;

    # Do not advertise the nginx patch version to the internet.
    server_tokens off;

    access_log /var/log/nginx/linkedin-profile-api.access.log;
    error_log  /var/log/nginx/linkedin-profile-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # $proxy_add_x_forwarded_for APPENDS to any inbound X-Forwarded-For
        # rather than replacing it, so the chain Cloudflare -> LB -> nginx
        # survives intact. uvicorn is started with --proxy-headers
        # --forwarded-allow-ips "*" (see the Dockerfile CMD), so the API reads
        # the real client IP and builds https:// URLs for an https:// request.

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Generous: a Voyager fetch under a slow LinkedIn session (stories 5-8)
        # can legitimately take tens of seconds. Shorter than any load-balancer
        # or Cloudflare idle timeout, so nginx is the one that reports the
        # timeout and it reaches the client as a typed error rather than a 524.
        proxy_read_timeout    75s;

        proxy_buffering on;
        proxy_redirect  off;
    }

    # Keycloak's token endpoint, so CAP-3's mint curl has a public path.
    # Longest-prefix wins in nginx, so this takes precedence over `location /`
    # regardless of ordering. Keycloak already trusts these headers
    # (KC_PROXY_HEADERS xforwarded, KC_HOSTNAME_STRICT false), which is what
    # makes the minted token's `iss` follow the public host rather than the
    # container name.
    #
    # /admin/ is deliberately NOT proxied and must stay that way: the Keycloak
    # admin console is reachable over an SSH tunnel to 127.0.0.1:8080 and has no
    # reason to face the internet.
    location /realms/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_redirect  off;
    }
}

# --- Notes --------------------------------------------------------------------
#
# /realms/ is wired above, so CAP-3's two curl commands both work over the
# public name: mint at https://<host>/realms/<realm>/protocol/openid-connect/token
# and call at https://<host>/api/v1/...
#
# After changing this file on the host:  nginx -t && systemctl reload nginx
