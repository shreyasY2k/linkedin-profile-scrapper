# Cheap insurance against story 9's history audit: gitleaks refuses the commit
# rather than leaving a secret to be scrubbed out of history later.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files          # one-off sweep
#   pre-commit run gitleaks --all-files # secrets only
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
