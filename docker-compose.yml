# The whole application stack. nginx and Docker are host-installed and are the
# only things configured outside this file (story 2).
#
# No `version:` key — obsolete, and Compose warns about it.
# No `platform:` key — all three images are native linux/arm64. Adding one
# drags in QEMU, under which the Keycloak JVM is slow and crash-prone.
# Every published port binds 127.0.0.1 only; nothing answers on the public
# interface, because nginx is what faces the world.

name: linkedin-profile-api

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required — cp .env.example .env}
    volumes:
      # Postgres 18 moved the volume path. Mounting /var/lib/postgresql/data
      # fails at container start on this image.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h 127.0.0.1 is what makes this honest: during initdb the entrypoint
      # runs a temporary server on the unix socket only, so a socket-based
      # pg_isready reports green while nothing can actually connect over TCP.
      # -U/-d pin the check to the role and database Keycloak and the API use.
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    # `start`, never `start-dev`: start-dev has insecure defaults and would make
    # local differ from deployed by command rather than by env. Plain `start`
    # does an implicit build at boot, so the stock image is enough.
    #
    # `--import-realm` reads every *.json under /opt/keycloak/data/import at
    # boot. The import strategy is IGNORE_EXISTING, so this is idempotent: the
    # realm is created on a cold volume and left alone on every later start.
    # Consequence worth knowing: editing KEYCLOAK_CLIENT_SECRET in .env after
    # the first boot does NOT reach an already-imported realm. Rotate it in the
    # admin console, or `docker compose down -v` and come back up.
    command: ["start", "--import-realm"]
    volumes:
      # The DIRECTORY, read-only — not the single file inside it. A bind mount
      # whose source file is missing or renamed makes Docker helpfully create
      # an empty DIRECTORY at that path; Keycloak then imports a directory as
      # a realm file, finds nothing, and boots healthy with no realm at all,
      # rejecting every token with nothing in the logs to explain it. Mounting
      # the directory removes that failure mode: the source exists in the
      # repository, and `--import-realm` reads every *.json inside it.
      #
      # The export carries no secret — the ${KEYCLOAK_CLIENT_SECRET},
      # ${KEYCLOAK_REALM} and ${KEYCLOAK_CLIENT_ID} placeholders inside it are
      # substituted by Keycloak's importer from the container environment.
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    environment:
      # KEYCLOAK_ADMIN/_PASSWORD are deprecated since 26.0 and silently ignored;
      # using them leaves the container with no admin at all.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      # Guarded like the postgres service: without :? a blank POSTGRES_DB
      # would let Keycloak start against the wrong database instead of failing
      # with a message that names the variable.
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required — cp .env.example .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required — cp .env.example .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — cp .env.example .env}
      # Health endpoints live on the management port (9000) and are off unless
      # this is set.
      KC_HEALTH_ENABLED: "true"
      # nginx terminates TLS in front (story 2); Keycloak needs no change there.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      # Consumed ONLY by the realm import above, which substitutes ${VAR} from
      # the container environment. Keycloak ignores non-KC_ variables otherwise.
      #
      # KEYCLOAK_CLIENT_SECRET is what keeps the committed export secret-free.
      # KEYCLOAK_REALM and KEYCLOAK_CLIENT_ID are here for the same reason
      # DATABASE_URL is composed from the POSTGRES_* parts in story 1: .env is
      # the single source of truth. Hardcoding them in the export would let a
      # .env edit produce a stack that boots green and 401s every token,
      # because the realm the API asks for would not be the realm that exists.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required — cp .env.example .env}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required — cp .env.example .env}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID is required — cp .env.example .env}
    # Keycloak sizes its heap as a percentage of the container limit. With no
    # limit it claims ~70% of the host.
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships neither curl nor wget, so this is the bash /dev/tcp
      # form. Note port 9000, not 8080.
      test:
        - CMD-SHELL
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # POSTGRES_* is the single source of truth for these credentials, and
      # `environment` overrides `env_file`, so editing POSTGRES_PASSWORD in
      # .env cannot leave the API holding a stale password encoded separately
      # in DATABASE_URL. /health checks no dependencies, so such a mismatch
      # would otherwise stay green until story 3 opened the first connection.
      # A password containing @ : / ? # would need percent-encoding here.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required — cp .env.example .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — cp .env.example .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required — cp .env.example .env}
      # Blanked, deliberately, and this line is load-bearing. `env_file` loads
      # the WHOLE of .env into this container, so a developer who filled in
      # LINKEDIN_DEV_COOKIE to run the live check would otherwise be shipping
      # their live LinkedIn session into the running service's environment —
      # readable via `docker inspect` and /proc/1/environ, and captured by
      # anything that dumps the environment on a crash. The service has no use
      # for it: callers supply their own session at runtime, and the live check
      # runs on the host, not in this container. `environment` overrides
      # `env_file`, and app/config.py treats blank as absent.
      LINKEDIN_DEV_COOKIE: ""
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # slim-trixie ships no curl either; stdlib urllib is already there.
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
